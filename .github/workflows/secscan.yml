name: Security Scan

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
    paths:
      - "broker/**"
      - "local/backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".github/workflows/secscan.yml"
  pull_request:
    paths:
      - "broker/**"
      - "local/backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".github/workflows/secscan.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  python-security:
    name: Python Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            broker/requirements.txt
            local/backend/requirements.txt

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit
        run: bandit -r broker local/backend --severity-level high --confidence-level medium -f json -o bandit-results.json

      - name: Audit Python dependencies
        run: |
          pip-audit --progress-spinner off -r broker/requirements.txt
          pip-audit --progress-spinner off -r local/backend/requirements.txt

  npm-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high
